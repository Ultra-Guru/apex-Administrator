org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ── AGP 9.1 兼容层（与已验证的 backdrop 消费组合一致）──────────────────
#
# backdrop 2.0.1 / shapes 1.2.1 以 Kotlin 2.4.10 元数据发布，且 AAR 元数据
# 要求 minAndroidGradlePluginVersion 9.1.0 —— 必须上 AGP 9。但 AGP 9 默认
# 启用「内置 Kotlin」，会拒绝 org.jetbrains.kotlin.android 插件：
#
#   ⛔ The 'org.jetbrains.kotlin.android' plugin is no longer required
#      for Kotlin support since AGP 9.0.
#
# 三开关（组合出处：AGP 9.1.0 + KGP 2.4.20 的在产 App，CI 全绿）：
# 1. 关闭内置 Kotlin —— 沿用 KGP 2.4.21 传统插件链（compose / serialization
#    编译器插件同版本随行）；
# 2. 沿用既有 DSL 集成语义（android {} 经典写法不迁移新 DSL）；
# 3. 内置 Lint 读不了 Kotlin 2.4 元数据（backdrop 类触发 lintRelease 崩溃）
#    —— 固定 lint 工具版本 9.4.1（映射 lint 32.4.1，可读 2.4 元数据）。
# 另：Kotlin 2.4 元数据要求 R8 ≥ 9.1.29 —— 根 build.gradle.kts 已以
# buildscript classpath 固定 com.android.tools:r8:9.4.24。
android.builtInKotlin=false
android.newDsl=false
android.experimental.lint.version=9.4.1
# compileSdk 37 超出 AGP 9.1 官方支持表 —— 抑制告警（37 与 37.0 两种形态都盖住），
# 并跳过平台目录名校验（runner 上 android-37 / android-37.0 均可命中）
android.suppressUnsupportedCompileSdk=37,37.0
android.overridePathCheck=true
